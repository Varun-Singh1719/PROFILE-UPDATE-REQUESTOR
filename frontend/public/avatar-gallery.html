<!doctype html>
<html><head><meta charset="utf-8"><title>Avatar Styles</title>
<style>
  body{font-family:-apple-system,system-ui,sans-serif;background:#f7f7fb;padding:24px;color:#111}
  h1{font-size:20px;margin:0 0 16px}
  .grid{display:grid;grid-template-columns:160px repeat(8,72px);gap:12px;align-items:center;margin-bottom:14px}
  .label{font-weight:600;font-size:13px}
  .sub{color:#666;font-size:11px;font-weight:400;display:block;margin-top:2px}
  .av{width:64px;height:64px;border-radius:50%;background:#fff;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
  .av img{width:100%;height:100%;display:block}
  .heading{font-size:11px;color:#999;text-align:center}
</style></head><body>
<h1>Cartoon-Avatar Styles — pick one to use as your preset set</h1>
<div class="grid">
  <div></div>
  <div class="heading">#1</div><div class="heading">#2</div><div class="heading">#3</div>
  <div class="heading">#4</div><div class="heading">#5</div><div class="heading">#6</div>
  <div class="heading">#7</div><div class="heading">#8</div>
</div>

<!-- Style row template -->
<script>
const SEEDS=["alpha","bravo","cara","delta","echo","fiona","gabe","hana"];
const STYLES=[
 {id:"fun-emoji",     name:"Fun Emoji",     sub:"Cartoon emoji faces (current)"},
 {id:"micah",         name:"Micah",         sub:"Illustrated faces — closest to iPhone Memoji"},
 {id:"avataaars",     name:"Avataaars",     sub:"Classic cartoon avatars (Apple-style)"},
 {id:"adventurer",    name:"Adventurer",    sub:"Cartoon faces with skin tones + hair"},
 {id:"notionists",    name:"Notionists",    sub:"Notion-style illustrated faces"},
 {id:"personas",      name:"Personas",      sub:"Illustrated portrait avatars"},
 {id:"big-smile",     name:"Big Smile",     sub:"Playful kids-drawing style"},
 {id:"lorelei",       name:"Lorelei",       sub:"Illustrated face portraits"},
 {id:"bottts",        name:"Bottts",        sub:"Robot avatars"},
 {id:"pixel-art",     name:"Pixel Art",     sub:"8-bit retro pixel faces"},
 {id:"open-peeps",    name:"Open Peeps",    sub:"Hand-drawn line-art people"},
];
const root=document.body;
for(const s of STYLES){
  const row=document.createElement("div");
  row.className="grid";
  const lbl=document.createElement("div");
  lbl.className="label";
  lbl.innerHTML=s.name+'<span class="sub">'+s.sub+'</span>';
  row.appendChild(lbl);
  for(const seed of SEEDS){
    const d=document.createElement("div");d.className="av";
    const im=document.createElement("img");
    im.src=`https://api.dicebear.com/9.x/${s.id}/svg?seed=${encodeURIComponent(seed)}&radius=50&backgroundType=gradientLinear&backgroundColor=ffd5dc,c0aede,fec5bb,b2f7ef,d4e5ff`;
    im.alt=s.id+":"+seed;
    d.appendChild(im);
    row.appendChild(d);
  }
  root.appendChild(row);
}
</script>
</body></html>
