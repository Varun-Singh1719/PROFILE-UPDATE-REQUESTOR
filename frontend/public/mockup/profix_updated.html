<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Profix Dashboard — updated layout</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  body{font-family:'Inter',system-ui,sans-serif;background:#f7f7f8}
  .brand{color:#ec9324}
  .bg-brand{background:#ec9324}
  .shadow-soft{box-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06)}
</style>
</head>
<body class="min-h-screen">

<!-- Topbar with tab bar (clickable stars for default) -->
<div class="h-14 bg-white/95 backdrop-blur border-b border-gray-200 flex items-center px-4 gap-3">
  <div class="flex-1 min-w-0 flex items-center gap-3 overflow-hidden">
    <div class="flex items-center gap-2">
      <div class="h-7 w-7 rounded-md bg-brand flex items-center justify-center text-white font-black">i</div>
      <span class="font-bold text-gray-900 text-sm">Dashboard</span>
    </div>
  </div>
  <div class="flex items-center gap-1.5 pr-2 mr-1 border-r border-gray-200">
    <!-- Tab bar -->
    <div class="inline-flex items-center gap-1 rounded-lg border border-gray-200 bg-white p-0.5">
      <!-- Workspace Manager tab (not active, IS default) -->
      <div class="inline-flex items-center rounded-md overflow-hidden hover:bg-gray-50">
        <button class="inline-flex items-center gap-1.5 pl-3 pr-2 h-8 text-xs font-medium text-gray-700">
          <span>▦</span> Workspace Manager
        </button>
        <button class="group relative h-8 w-7 inline-flex items-center justify-center cursor-default" title="Default View">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="#ec9324" stroke="#ec9324" stroke-width="2"><polygon points="12,2 15,9 22,10 17,15 18,22 12,18 6,22 7,15 2,10 9,9"/></svg>
          <span class="pointer-events-none absolute top-full mt-1 left-1/2 -translate-x-1/2 px-1.5 py-0.5 rounded bg-gray-800 text-white text-[10px] font-semibold whitespace-nowrap z-20 shadow-md">Default View</span>
        </button>
      </div>
      <!-- Profix tab (active, NOT default) -->
      <div class="inline-flex items-center rounded-md overflow-hidden bg-brand shadow-sm">
        <button class="inline-flex items-center gap-1.5 pl-3 pr-2 h-8 text-xs font-medium text-white">
          <span>▤</span> Profix
        </button>
        <button class="group relative h-8 w-7 inline-flex items-center justify-center hover:bg-white/15 cursor-pointer" title="Set as Default">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"><polygon points="12,2 15,9 22,10 17,15 18,22 12,18 6,22 7,15 2,10 9,9"/></svg>
          <span class="pointer-events-none absolute top-full mt-1 left-1/2 -translate-x-1/2 px-1.5 py-0.5 rounded bg-gray-800 text-white text-[10px] font-semibold opacity-100 whitespace-nowrap z-20 shadow-md">Set as Default</span>
        </button>
      </div>
    </div>
  </div>
  <button class="flex items-center gap-2 pl-1 pr-2 py-1 rounded-full hover:bg-gray-100">
    <div class="h-7 w-7 rounded-full bg-gradient-to-br from-orange-400 to-orange-600 text-white flex items-center justify-center font-bold text-xs">AD</div>
    <span class="text-xs font-semibold text-gray-800">Admin</span>
  </button>
</div>

<!-- CONTENT — reduced padding, greeting row with New Request + Date + Refresh next to each other -->
<div class="w-full px-3 sm:px-4 pt-2 pb-4">

  <!-- Compact page header (Hi Admin + inline actions) -->
  <div class="flex items-center justify-between gap-3 flex-wrap mb-4">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Hi Admin 👋</h1>
      <p class="text-sm text-gray-500 mt-0.5">Monday, 15 July 2026</p>
    </div>
    <div class="flex items-center gap-2 flex-wrap">
      <!-- Compact DateFilter -->
      <button class="inline-flex items-center gap-2 h-9 px-3 rounded-md border border-gray-200 bg-white text-sm text-gray-800">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ec9324" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Jul 2026</span>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <button class="inline-flex items-center gap-1.5 h-9 px-3 rounded-md bg-brand hover:brightness-110 text-white text-sm font-semibold shadow-sm">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Request
      </button>
      <button class="h-9 w-9 rounded-md border border-gray-200 bg-white text-gray-500 hover:text-brand hover:border-brand inline-flex items-center justify-center" title="Refresh">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
      </button>
    </div>
  </div>

  <!-- Metric row -->
  <div class="grid grid-cols-4 gap-4">
    <div class="bg-white rounded-xl p-4 border border-gray-100 shadow-soft">
      <div class="text-xs text-gray-500 mb-1">Total Requests</div>
      <div class="flex items-center justify-between">
        <div class="text-3xl font-bold text-gray-900">128</div>
        <div class="h-9 w-9 rounded-lg bg-gray-100 flex items-center justify-center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><path d="M20 12l-2-2-8 8-6-6 2-2"/></svg>
        </div>
      </div>
    </div>
    <div class="bg-white rounded-xl p-4 border border-gray-100 shadow-soft">
      <div class="text-xs text-gray-500 mb-1">Open</div>
      <div class="flex items-center justify-between">
        <div class="text-3xl font-bold" style="color:#ec9324">47</div>
        <div class="h-9 w-9 rounded-lg bg-orange-50 flex items-center justify-center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ec9324" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
      </div>
    </div>
    <div class="bg-white rounded-xl p-4 border border-gray-100 shadow-soft">
      <div class="text-xs text-gray-500 mb-1">In Progress</div>
      <div class="flex items-center justify-between">
        <div class="text-3xl font-bold text-green-600">32</div>
        <div class="h-9 w-9 rounded-lg bg-green-50 flex items-center justify-center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/></svg>
        </div>
      </div>
    </div>
    <div class="bg-white rounded-xl p-4 border border-gray-100 shadow-soft">
      <div class="text-xs text-gray-500 mb-1">Closed</div>
      <div class="flex items-center justify-between">
        <div class="text-3xl font-bold text-gray-500">49</div>
        <div class="h-9 w-9 rounded-lg bg-gray-100 flex items-center justify-center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/></svg>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-8 mb-3 flex items-center gap-2 text-lg font-semibold text-gray-900">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ec9324" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>
    DQ Team Performance
  </div>

</div>

</body>
</html>
