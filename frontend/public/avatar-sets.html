<!doctype html>
<html><head><meta charset="utf-8"><title>Avatar Sets — Large</title>
<style>
  body{font-family:-apple-system,system-ui,sans-serif;background:#f7f7fb;padding:20px;color:#111;margin:0}
  .style{background:#fff;border-radius:14px;padding:18px 20px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
  .style h2{font-size:16px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
  .style .num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#ec9324;color:#fff;font-size:13px;font-weight:700}
  .style .sub{color:#666;font-size:12px;margin-bottom:14px}
  .row{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
  .av{width:92px;height:92px;border-radius:50%;background:#fff;overflow:hidden;box-shadow:0 0 0 1px #eee}
  .av img{width:100%;height:100%;display:block}
</style></head><body>

<script>
const SEEDS=["alpha","bravo","cara","delta","echo","fiona","gabe","hana","ivan","julie","kavi","lia"];
const STYLES=[
 {id:"micah",         name:"Micah",         sub:"Illustrated faces — closest to iPhone Memoji"},
 {id:"avataaars",     name:"Avataaars",     sub:"Classic cartoon avatars (Apple-style)"},
 {id:"adventurer",    name:"Adventurer",    sub:"Cartoon faces with skin tones & hair"},
 {id:"personas",      name:"Personas",      sub:"Illustrated portrait avatars"},
 {id:"notionists",    name:"Notionists",    sub:"Notion-style line illustrations"},
 {id:"big-smile",     name:"Big Smile",     sub:"Playful kids-drawing style"},
 {id:"lorelei",       name:"Lorelei",       sub:"Simple monochrome line portraits"},
 {id:"fun-emoji",     name:"Fun Emoji",     sub:"Cartoon emoji faces (current)"},
 {id:"bottts",        name:"Bottts",        sub:"Robot avatars"},
 {id:"pixel-art",     name:"Pixel Art",     sub:"8-bit retro pixel faces"},
 {id:"open-peeps",    name:"Open Peeps",    sub:"Hand-drawn line-art people"},
];
const root=document.body;
STYLES.forEach((s,i)=>{
  const sec=document.createElement("section");sec.className="style";
  sec.innerHTML=`<h2><span class="num">${i+1}</span> ${s.name}</h2><div class="sub">${s.sub}</div><div class="row"></div>`;
  const row=sec.querySelector(".row");
  for(const seed of SEEDS){
    const d=document.createElement("div");d.className="av";
    const im=document.createElement("img");
    im.src=`https://api.dicebear.com/9.x/${s.id}/svg?seed=${encodeURIComponent(seed)}&radius=50&backgroundType=gradientLinear&backgroundColor=ffd5dc,c0aede,fec5bb,b2f7ef,d4e5ff`;
    d.appendChild(im);row.appendChild(d);
  }
  root.appendChild(sec);
});
</script>
</body></html>
